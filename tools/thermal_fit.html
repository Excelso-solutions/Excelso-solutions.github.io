const HELP_RU=`<div class="hp"><p><b>Что считаем.</b> Если при заданной температуре посадка с натягом (диаметральный натяг δ = −S, где S - зазор), в соединении возникает контактное давление p. Считаем напряжения в детали с отверстием и в вале и сравниваем их с пределом упругости. Размеры берутся с учётом теплового расширения. Расчёт ведётся для наибольшего натяга (худший случай), для наименьшего выводится только давление.</p>
<p><b>1. Контактное давление (задача Ляме).</b><br><code>p = δ / ( d · [ (1/E<sub>о</sub>)·((D<sub>н</sub>² + d²)/(D<sub>н</sub>² − d²) + ν<sub>о</sub>) + (1/E<sub>в</sub>)·((d² + d<sub>i</sub>²)/(d² − d<sub>i</sub>²) − ν<sub>в</sub>) ] )</code><br>d - диаметр посадки; D<sub>н</sub> - наружный диаметр детали с отверстием; d<sub>i</sub> - диаметр отверстия в валу (0 для сплошного); E, ν - модуль упругости и коэффициент Пуассона (индекс «о» - деталь с отверстием, «в» - вал).</p>
<p><b>2. Напряжения.</b><br>Деталь с отверстием, у посадочной поверхности: <code>σ<sub>θ</sub> = p·(D<sub>н</sub>² + d²)/(D<sub>н</sub>² − d²)</code> (растяжение), <code>σ<sub>r</sub> = −p</code>.<br>Вал, у посадочной поверхности: <code>σ<sub>θ</sub> = −p·(d² + d<sub>i</sub>²)/(d² − d<sub>i</sub>²)</code>, <code>σ<sub>r</sub> = −p</code>. У внутренней поверхности полого вала: <code>σ<sub>θ</sub> = −2p·d²/(d² − d<sub>i</sub>²)</code>, <code>σ<sub>r</sub> = 0</code>.</p>
<p><b>3. Эквивалентное напряжение (Мизес).</b> <code>σ<sub>экв</sub> = √(σ<sub>θ</sub>² + σ<sub>r</sub>² − σ<sub>θ</sub>·σ<sub>r</sub>)</code></p>
<p><b>4. Проверка упругости.</b> Сравниваем σ<sub>экв</sub> с пределом текучести R<sub>p0,2</sub> при данной температуре; запас n = R<sub>p</sub>/σ<sub>экв</sub>. Если σ<sub>экв</sub> ≤ 0,8·R<sub>p</sub> - упруго с запасом; от 0,8 до 1,0·R<sub>p</sub> - упруго, но запас мал; выше R<sub>p</sub> - пластическая деформация. Для хрупких материалов (чугун, керамика, графит) сравнение идёт с пределом прочности, превышение означает риск разрушения.</p>
<p><b>5. Зависимость от температуры.</b> Размеры: ε = (T − 20)·α<sub>ср</sub>(T); α<sub>ср</sub> берётся из таблицы материала, а если её нет - из модели α<sub>ср</sub> = α<sub>100</sub> − 0,8·dα + dα/100·(T − 20). E и R<sub>p</sub>: из таблиц материала с линейной интерполяцией, а если их нет - линейное снижение по классу материала (в отчёте указано, что использовано).</p>
<p><b>Допущения и ограничения.</b></p><ul style="margin:4px 0 4px 18px;padding:0"><li>плоское напряжённое состояние (σ<sub>z</sub> = 0), цилиндрические тела, материал изотропный и линейно упругий;</li><li>обе детали равномерно прогреты до одной температуры, градиенты и неодинаковый нагрев не учитываются;</li><li>давление равномерно по длине посадки; краевые эффекты и концентрации напряжений у торцов не учитываются;</li><li>шероховатость не учитывается (она сглаживается при сборке и уменьшает эффективный натяг примерно на 1,2·(Rz<sub>1</sub> + Rz<sub>2</sub>));</li><li>не учитываются осевые усилия, центробежные силы, трение, ползучесть и релаксация (особенно у полимеров), остаточные напряжения после сборки;</li><li>в формулах d принят равным среднему номинальному диаметру посадки;</li><li>значения E, ν и R<sub>p</sub> справочные, у конкретной партии и поставщика отличаются.</li></ul></div>`;
const HELP_EN=`<div class="hp"><p><b>What is calculated.</b> If at the given temperature the joint is an interference fit (diametral interference δ = −S, where S is the clearance), a contact pressure p arises. The stresses in the part with the hole and in the shaft are calculated and compared with the elastic limit. Sizes include thermal expansion. The calculation is made for the maximum interference (worst case); for the minimum interference only the pressure is shown.</p>
<p><b>1. Contact pressure (Lamé problem).</b><br><code>p = δ / ( d · [ (1/E<sub>h</sub>)·((D<sub>o</sub>² + d²)/(D<sub>o</sub>² − d²) + ν<sub>h</sub>) + (1/E<sub>s</sub>)·((d² + d<sub>i</sub>²)/(d² − d<sub>i</sub>²) − ν<sub>s</sub>) ] )</code><br>d - fit diameter; D<sub>o</sub> - outer diameter of the part with the hole; d<sub>i</sub> - bore diameter in the shaft (0 for a solid shaft); E, ν - Young's modulus and Poisson's ratio (index "h" - part with the hole, "s" - shaft).</p>
<p><b>2. Stresses.</b><br>Part with the hole, at the fit surface: <code>σ<sub>θ</sub> = p·(D<sub>o</sub>² + d²)/(D<sub>o</sub>² − d²)</code> (tension), <code>σ<sub>r</sub> = −p</code>.<br>Shaft, at the fit surface: <code>σ<sub>θ</sub> = −p·(d² + d<sub>i</sub>²)/(d² − d<sub>i</sub>²)</code>, <code>σ<sub>r</sub> = −p</code>. At the inner surface of a hollow shaft: <code>σ<sub>θ</sub> = −2p·d²/(d² − d<sub>i</sub>²)</code>, <code>σ<sub>r</sub> = 0</code>.</p>
<p><b>3. Equivalent stress (von Mises).</b> <code>σ<sub>eq</sub> = √(σ<sub>θ</sub>² + σ<sub>r</sub>² − σ<sub>θ</sub>·σ<sub>r</sub>)</code></p>
<p><b>4. Elastic check.</b> σ<sub>eq</sub> is compared with the yield strength R<sub>p0.2</sub> at the given temperature; safety factor n = R<sub>p</sub>/σ<sub>eq</sub>. If σ<sub>eq</sub> ≤ 0.8·R<sub>p</sub> - elastic with margin; between 0.8 and 1.0·R<sub>p</sub> - elastic but the margin is small; above R<sub>p</sub> - plastic deformation. For brittle materials (cast iron, ceramics, graphite) the tensile strength is used instead; exceeding it means a risk of fracture.</p>
<p><b>5. Temperature dependence.</b> Sizes: ε = (T − 20)·α<sub>m</sub>(T); α<sub>m</sub> comes from the material's table, or, if there is none, from the model α<sub>m</sub> = α<sub>100</sub> − 0.8·dα + dα/100·(T − 20). E and R<sub>p</sub>: from the material's tables with linear interpolation, or, if there are none, a linear reduction according to the material class (the report states which was used).</p>
<p><b>Assumptions and limitations.</b></p><ul style="margin:4px 0 4px 18px;padding:0"><li>plane stress (σ<sub>z</sub> = 0), cylindrical bodies, isotropic linearly elastic material;</li><li>both parts are uniformly heated to the same temperature; gradients and unequal heating are ignored;</li><li>the pressure is uniform along the fit length; edge effects and stress concentrations at the ends are ignored;</li><li>roughness is ignored (it is smoothed out during assembly and reduces the effective interference by about 1.2·(Rz<sub>1</sub> + Rz<sub>2</sub>));</li><li>axial loads, centrifugal forces, friction, creep and relaxation (especially of polymers) and residual stresses after assembly are ignored;</li><li>d in the formulas is the mean nominal fit diameter;</li><li>E, ν and R<sub>p</sub> are handbook values and differ between batches and suppliers.</li></ul></div>`;
const HELP=()=>lang=='en'?HELP_EN:HELP_RU;

function applyDes(hl,hg,sl,sg){const h=holeDev(hl,hg,num('dH',LG('диаметр отверстия','hole diameter'))),s=shaftDev(sl,sg,num('dS',LG('диаметр вала','shaft diameter')));setv('ES',h[0]);setv('EI',h[1]);setv('es',s[0]);setv('ei',s[1])}
function sync(src){try{let hl,hg,sl,sg;
 if(src=='fit'){const f=norm($('fit').value),p=f.indexOf('/');if(p<1)return;const h=parseTol(f.slice(0,p),true),s=parseTol(f.slice(p+1),false);hl=h.l;hg=h.g;sl=s.l;sg=s.g;
  if(![...$('hL').options].some(o=>o.value==hl)||![...$('sL').options].some(o=>o.value==sl))return;
  $('hL').value=hl;$('hG').value=hg;$('sL').value=sl;$('sG').value=sg}
 else{hl=$('hL').value;hg=+$('hG').value;sl=$('sL').value;sg=+$('sG').value;$('fit').value=hl+hg+'/'+sl+sg}
 applyDes(hl,hg,sl,sg)}catch(e){}}
function setMode(){const m=$('r1').checked?1:$('r2').checked?2:3;
 $('fit').disabled=m!=1;['hL','hG','sL','sG'].forEach(i=>$(i).disabled=m!=2);['ES','EI','es','ei'].forEach(i=>$(i).disabled=m!=3);return m}
['r1','r2','r3'].forEach(i=>$(i).onchange=()=>{const m=setMode();if(m==1)sync('fit');if(m==2)sync('sep')});
$('fit').oninput=()=>sync('fit');['hL','hG','sL','sG'].forEach(i=>$(i).onchange=()=>sync('sep'));
['dS','dH'].forEach(i=>$(i).oninput=()=>{const m=setMode();if(m==1){$(i=='dS'?'dH':'dS').value=$(i).value;sync('fit')}else if(m==2)sync('sep')});
applyLang();rebuild();setMode();sync('fit');run();
